<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CoachIA Foot — Créer mon compte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
    :root {
        --navy: #0B2545; --navy-deep: #071A33; --green: #2E8B57; --green-bright: #3FAE72;
        --paper: #F3F5F1; --ink: #16202B;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: var(--paper); color: var(--ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 32px 16px; }
    .card { background: white; width: 100%; max-width: 420px; border-radius: 10px; overflow: hidden; border: 1px solid #d8dde3; box-shadow: 0 30px 60px -30px rgba(11,37,69,0.35); }
    .card-header { background: var(--navy-deep); color: white; padding: 26px 28px; }
    .card-header .eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--green-bright); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 6px; }
    .card-header h1 { font-family: 'Oswald'; font-size: 20px; text-transform: uppercase; letter-spacing: 0.02em; }
    form { padding: 26px 28px 24px; display: flex; flex-direction: column; gap: 16px; }
    label { display: block; font-size: 13px; font-weight: 600; color: var(--navy); margin-bottom: 6px; }
    input {
        width: 100%; border: 1px solid #d8dde3; border-radius: 6px; padding: 11px 12px;
        font-family: 'Inter'; font-size: 14px; color: var(--ink); background: #fafbfa;
    }
    input:focus { outline: 2px solid var(--green); outline-offset: 1px; border-color: var(--green); }
    button[type="submit"] {
        background: var(--green); color: white; border: none; border-radius: 6px;
        padding: 14px; font-family: 'Oswald'; font-size: 14px; text-transform: uppercase;
        letter-spacing: 0.03em; font-weight: 600; cursor: pointer; margin-top: 6px;
    }
    button[type="submit"]:hover { background: var(--green-bright); }
    button[type="submit"]:disabled { background: #a9b4c0; }
    .status { font-size: 13px; text-align: center; min-height: 18px; }
    .status.error { color: #c0392b; }
    .footer-link { text-align: center; padding: 0 28px 26px; font-size: 13px; color: #6b7684; }
    .footer-link a { color: var(--green); font-weight: 600; }
</style>
</head>
<body>

<div class="card">
    <div class="card-header">
        <div class="eyebrow">CoachIA Foot</div>
        <h1>Créer mon compte club</h1>
    </div>

    <form id="form-inscription">
        <div>
            <label for="nom">Nom du club</label>
            <input type="text" id="nom" name="nom" placeholder="ex : Diogountouro FC" required>
        </div>
        <div>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
        </div>
        <div>
            <label for="mot_de_passe">Mot de passe</label>
            <input type="password" id="mot_de_passe" name="mot_de_passe" minlength="6" required>
        </div>
        <button type="submit" id="submit-btn">Créer mon compte</button>
        <div class="status" id="status"></div>
    </form>

    <div class="footer-link">Déjà un compte ? <a href="/connexion">Se connecter</a></div>
</div>

<script>
    const form = document.getElementById('form-inscription');
    const statusEl = document.getElementById('status');
    const btn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        btn.disabled = true;
        statusEl.className = 'status';
        statusEl.textContent = '';

        const payload = Object.fromEntries(new FormData(form).entries());

        try {
            const res = await fetch('/api/inscription', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const result = await res.json();

            if (!res.ok) throw new Error(result.erreur || 'Erreur');

            window.location.href = '/';
        } catch (err) {
            statusEl.className = 'status error';
            statusEl.textContent = err.message;
            btn.disabled = false;
        }
    });
</script>

</body>
</html>
