<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<style>
    @page { margin: 0; size: A4; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        font-family: 'Helvetica Neue', Arial, sans-serif;
        color: #1a1a1a;
        width: 210mm;
        min-height: 297mm;
    }

    /* --- Variables de marque injectées dynamiquement --- */
    :root {
        --couleur-primaire: {{couleur_primaire}};   /* ex: #0B2545 */
        --couleur-secondaire: {{couleur_secondaire}}; /* ex: #2E8B57 */
    }

    .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: var(--couleur-primaire);
        color: white;
        padding: 18px 28px;
    }
    .header .club-info { display: flex; align-items: center; gap: 14px; }
    .header img.logo { height: 50px; width: 50px; object-fit: contain; background: white; border-radius: 6px; padding: 4px; }
    .header h1 { font-size: 20px; font-weight: 700; }
    .header .meta { font-size: 12px; opacity: 0.85; margin-top: 2px; }
    .header .badge {
        background: var(--couleur-secondaire);
        padding: 6px 14px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 600;
    }

    .contenu { padding: 24px 28px; display: flex; flex-direction: column; gap: 16px; }

    .objectif {
        background: #f4f6f8;
        border-left: 4px solid var(--couleur-secondaire);
        padding: 12px 16px;
        font-size: 13px;
    }
    .objectif strong { color: var(--couleur-primaire); }

    .exercice {
        display: flex;
        border: 1px solid #e2e5e8;
        border-radius: 8px;
        overflow: hidden;
    }
    .exercice .duree {
        background: var(--couleur-primaire);
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        min-width: 70px;
        font-weight: 700;
        font-size: 14px;
    }
    .exercice .detail { padding: 12px 16px; flex: 1; display: flex; flex-direction: column; gap: 4px; }
    .exercice .detail .titre { font-size: 14px; font-weight: 700; color: var(--couleur-primaire); }
    .exercice .detail .consigne { font-size: 12px; color: #333; line-height: 1.4; }
    .exercice .categorie {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: var(--couleur-secondaire);
        font-weight: 700;
    }

    .footer {
        margin-top: auto;
        padding: 14px 28px;
        border-top: 2px solid var(--couleur-primaire);
        font-size: 10px;
        color: #888;
        display: flex;
        justify-content: space-between;
    }
</style>
</head>
<body>

    <div class="header">
        <div class="club-info">
            <img class="logo" src="{{logo_url}}" alt="logo">
            <div>
                <h1>{{club_nom}}</h1>
                <div class="meta">Séance du {{date_seance}} — {{effectif_dispo}} joueurs disponibles</div>
            </div>
        </div>
        <div class="badge">{{formation}}</div>
    </div>

    <div class="contenu">
        <div class="objectif">
            <strong>Objectif de la séance :</strong> {{objectif_semaine}}
        </div>

        <!-- BLOC_EXERCICES : répété dynamiquement par le script Python -->
        {{blocs_exercices}}

    </div>

    <div class="footer">
        <span>{{club_nom}} — Généré par CoachIA Foot</span>
        <span>{{date_generation}}</span>
    </div>

</body>
</html>
